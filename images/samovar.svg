<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 640" role="img" aria-labelledby="t">
  <title id="t">Латунный электрический самовар с чайником</title>
  <defs>
    <linearGradient id="brass" x1="0" x2="1">
      <stop offset="0" stop-color="#a8741c"/>
      <stop offset=".35" stop-color="#f3c45a"/>
      <stop offset=".6" stop-color="#d79b2b"/>
      <stop offset="1" stop-color="#8f5f14"/>
    </linearGradient>
    <linearGradient id="pot" x1="0" x2="1">
      <stop offset="0" stop-color="#1f4fbf"/>
      <stop offset=".5" stop-color="#6b8fe8"/>
      <stop offset="1" stop-color="#173c94"/>
    </linearGradient>
  </defs>
  <ellipse cx="320" cy="590" rx="170" ry="20" fill="#e3e8f2"/>
  <!-- чайник -->
  <path d="M265 120c0-30 110-30 110 0v40h-110z" fill="url(#pot)"/>
  <path d="M375 130c30 0 45 20 40 40" fill="none" stroke="#173c94" stroke-width="10" stroke-linecap="round"/>
  <path d="M265 140l-40-25" stroke="#173c94" stroke-width="12" stroke-linecap="round"/>
  <circle cx="320" cy="88" r="10" fill="#173c94"/>
  <g fill="#fff"><circle cx="300" cy="135" r="6"/><circle cx="320" cy="140" r="6"/><circle cx="340" cy="135" r="6"/></g>
  <!-- конфорка -->
  <rect x="270" y="160" width="100" height="26" rx="6" fill="#8f5f14"/>
  <!-- корпус -->
  <path d="M200 200h240c30 60 30 200 0 260h-240c-30-60-30-200 0-260z" fill="url(#brass)"/>
  <g fill="none" stroke="#8f5f14" stroke-width="6">
    <path d="M190 250h260"/><path d="M190 410h260"/>
  </g>
  <!-- ручки -->
  <g fill="none" stroke="#3b2a12" stroke-width="16" stroke-linecap="round">
    <path d="M200 240c-50 0-50 70 0 70"/>
    <path d="M440 240c50 0 50 70 0 70"/>
  </g>
  <!-- кран -->
  <path d="M320 380h70c15 0 20 15 15 25l-10 20h-20l5-15h-60z" fill="#8f5f14"/>
  <rect x="380" y="360" width="14" height="26" rx="4" fill="#3b2a12"/>
  <!-- медали -->
  <g fill="#fbe39a" stroke="#a8741c" stroke-width="3">
    <circle cx="270" cy="330" r="14"/><circle cx="310" cy="330" r="14"/>
  </g>
  <!-- ножка и основание -->
  <path d="M260 460h120l20 70h-160z" fill="url(#brass)"/>
  <rect x="210" y="530" width="220" height="34" rx="10" fill="url(#brass)"/>
  <g fill="#8f5f14"><circle cx="230" cy="572" r="10"/><circle cx="410" cy="572" r="10"/></g>
</svg>
